name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# Pull requests cancel stale runs; main never does, so a deploy is not cut off halfway.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      # Installs pnpm and Node from devEngines, then runs a frozen install.
      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true

      # The Firebase emulators run on the JVM.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      # fetch-catalog.ts holds the pinned dataset commit, so its hash changes with the commit.
      - uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: .catalog-cache
          key: catalog-${{ hashFiles('scripts/fetch-catalog.ts', 'scripts/catalog-manifest.sha256') }}

      - uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ~/.cache/firebase/emulators
          key: firebase-emulators-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - run: pnpm exec playwright install --with-deps chromium

      - run: pnpm check

      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7

  # No secrets here: this job installs and runs the project's dependencies.
  build-prod:
    needs: [check]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          require-lockfile: true

      - uses: actions/cache@2c8a9bd7457de244a408f35966fab2fb45fda9c8 # v6.0.0
        with:
          path: .catalog-cache
          key: catalog-${{ hashFiles('scripts/fetch-catalog.ts', 'scripts/catalog-manifest.sha256') }}

      # The web config is public (it ships in the bundle), so it lives in repository variables.
      - name: Write the production web config
        env:
          API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}
        run: |
          for value in "$API_KEY" "$AUTH_DOMAIN" "$PROJECT_ID" "$APP_ID"; do
            [ -n "$value" ] || { echo "A VITE_FIREBASE_* repository variable is missing" >&2; exit 1; }
          done
          {
            echo "VITE_FIREBASE_API_KEY=$API_KEY"
            echo "VITE_FIREBASE_AUTH_DOMAIN=$AUTH_DOMAIN"
            echo "VITE_FIREBASE_PROJECT_ID=$PROJECT_ID"
            echo "VITE_FIREBASE_APP_ID=$APP_ID"
          } > .env.production.local

      - run: pnpm catalog

      - run: pnpm build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error
          retention-days: 7

  # The only job with the service account: it never installs or runs the project's dependencies.
  deploy:
    needs: [build-prod]
    runs-on: ubuntu-latest
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
      # firestore.rules and firebase.json.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      # The devDependencies version; deploy needs no native module, so install scripts stay off.
      - run: npm install --global --ignore-scripts --no-audit --no-fund firebase-tools@15.34.2

      - name: Deploy rules and hosting
        env:
          SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_PERSONAL_WORKOUT_1B06F }}
        run: |
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/service-account.json"
          printf '%s' "$SERVICE_ACCOUNT" > "$GOOGLE_APPLICATION_CREDENTIALS"
          firebase deploy --only firestore:rules,hosting --project personal-workout-1b06f --non-interactive
